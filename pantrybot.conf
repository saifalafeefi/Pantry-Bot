
<VirtualHost *:8080>
    ServerName YOUR_SERVER_DOMAIN_OR_IP_HERE
    DocumentRoot /var/www/pantrybot

    <Directory /var/www/pantrybot>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /auth/ http://localhost:5000/auth/
    ProxyPassReverse /auth/ http://localhost:5000/auth/
    ProxyPass /grocery/ http://localhost:5000/grocery/
    ProxyPassReverse /grocery/ http://localhost:5000/grocery/
    ProxyPass /pantry/ http://localhost:5000/pantry/
    ProxyPassReverse /pantry/ http://localhost:5000/pantry/
    ProxyPass /users http://localhost:5000/users
    ProxyPassReverse /users http://localhost:5000/users
    ProxyPass /recipes http://localhost:5000/recipes
    ProxyPassReverse /recipes http://localhost:5000/recipes
	ProxyPass /ingredients/suggestions http://localhost:5000/ingredients/suggestions
	ProxyPassReverse /ingredients/suggestions http://localhost:5000/ingredients/suggestions
	ProxyPass /ingredients/add-to-history http://localhost:5000/ingredients/add-to-history
	ProxyPassReverse /ingredients/add-to-history http://localhost:5000/ingredients/add-to-history
	
</VirtualHost>

<VirtualHost *:8443>
    ServerName YOUR_SERVER_DOMAIN_OR_IP_HERE
    DocumentRoot /var/www/pantrybot

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/pantrybot.crt
    SSLCertificateKeyFile /etc/ssl/private/pantrybot.key

    <Directory /var/www/pantrybot>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /auth/ http://localhost:5000/auth/
    ProxyPassReverse /auth/ http://localhost:5000/auth/
    ProxyPass /grocery/ http://localhost:5000/grocery/
    ProxyPassReverse /grocery/ http://localhost:5000/grocery/
    ProxyPass /pantry/ http://localhost:5000/pantry/
    ProxyPassReverse /pantry/ http://localhost:5000/pantry/
    ProxyPass /users http://localhost:5000/users
    ProxyPassReverse /users http://localhost:5000/users
    ProxyPass /recipes http://localhost:5000/recipes
    ProxyPassReverse /recipes http://localhost:5000/recipes
	ProxyPass /ingredients/suggestions http://localhost:5000/ingredients/suggestions
	ProxyPassReverse /ingredients/suggestions http://localhost:5000/ingredients/suggestions
	ProxyPass /ingredients/add-to-history http://localhost:5000/ingredients/add-to-history
	ProxyPassReverse /ingredients/add-to-history http://localhost:5000/ingredients/add-to-history

</VirtualHost>

# OTA Update API Proxy
ProxyPreserveHost On
ProxyRequests Off

# Proxy /api/* requests to Flask app on localhost:5000
ProxyPass /api/ http://localhost:5000/api/
ProxyPassReverse /api/ http://localhost:5000/api/

# Also proxy direct /version endpoint
ProxyPass /version http://localhost:5000/version
ProxyPassReverse /version http://localhost:5000/version
